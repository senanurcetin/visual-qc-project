version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # OpenCV 5 removed cv2.HOGDescriptor, which the HOG feature pipeline (and every reported
      # Random Forest number) depends on. Stay on 4.x until that is ported and re-evaluated.
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

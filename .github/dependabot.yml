version: 2
# One grouped pull request per month keeps the update noise low; majors stay separate.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # OpenCV 5 removed cv2.HOGDescriptor, which the HOG feature pipeline (and every reported
      # Random Forest number) depends on. Stay on 4.x until that is ported and re-evaluated.
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]
      # opencv-python-headless 4.12 requires numpy<2.3, so numpy cannot move until OpenCV does
      # (numpy 2.5 also needs Python >= 3.12). Revisit together with the OpenCV bump.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # requirements-dl.txt / requirements-rag.txt use deliberately loose torch floors (e.g. torch>=2.5):
      # installers put a CUDA build matching the machine's driver first, and a raised floor would
      # make pip swap it for the default PyPI build. Bump them by hand when a feature needs it.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

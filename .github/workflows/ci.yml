name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and type check
        run: |
          ruff check .
          mypy

      - name: Syntax check
        run: |
          python -m py_compile main.py case_study.py rag_demo.py
          python -m py_compile analysis/run_rag_case_study.py analysis/generate_rag_visuals.py
          python -m py_compile analysis/rag/chunking.py analysis/rag/metrics.py analysis/rag/corpus.py
          python -m py_compile analysis/run_neu_case_study.py
          python -m py_compile analysis/generate_visuals.py
          python -m py_compile analysis/run_dl_case_study.py analysis/dl/calibration.py analysis/dl/stats.py analysis/dl/preflight.py analysis/update_docs_from_dl.py

      - name: Generate visualization assets
        run: |
          python analysis/generate_visuals.py
          python analysis/generate_rag_visuals.py

      - name: Unit tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Import app
        run: python -c "import main; print(main.app.name)"

  dl-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-serve.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxscript

      - name: CNN pipeline smoke test (synthetic images, CPU)
        run: python -m unittest tests.test_dl_torch tests.test_classify -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start app
        run: |
          python -m flask --app main run --port 8081 > flask.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/api/data > /dev/null && break; sleep 1; done

      - name: Browser smoke tests
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: python -m unittest discover -s tests/e2e -v

      - name: Server log on failure
        if: failure()
        run: cat flask.log

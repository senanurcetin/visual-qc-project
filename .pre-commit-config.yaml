repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: nexus-ci-preflight
        name: Verify CircleCI and notebook sources
        entry: python scripts/ci_preflight.py
        language: system
        pass_filenames: false
        always_run: true

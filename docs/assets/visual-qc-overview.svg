<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Visual QC — computer vision quality assurance</title>
<desc id="desc">Concept diagram of a steel surface inspection workflow: camera, classifier, human review, and documented evidence. Not a real-time camera capture or measured production result.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151F"/><stop offset="1" stop-color="#162D3B"/></linearGradient><linearGradient id="metal" x2="1" y2=".5"><stop stop-color="#B2C2C8"/><stop offset=".5" stop-color="#5D7482"/><stop offset="1" stop-color="#B6C8CD"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#98B2C6" stroke-opacity=".08"/></pattern></defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<rect x="58" y="51" width="243" height="34" rx="17" fill="#183F49" stroke="#368E8A"/><text x="179" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#8DEBD8">INDUSTRIAL COMPUTER VISION</text>
<text x="58" y="178" font-family="Arial,sans-serif" font-size="78" font-weight="700" fill="#FFFFFF">Visual QC</text>
<text x="58" y="245" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#95E4DC">Steel Defect Intelligence</text>
<text x="58" y="306" font-family="Arial,sans-serif" font-size="21" fill="#BDD3DB">Image classification, confidence-aware review,</text>
<text x="58" y="337" font-family="Arial,sans-serif" font-size="21" fill="#BDD3DB">quality analytics and document-grounded RAG.</text>

# Full local stack: the app (gunicorn) + Postgres for operator review decisions.
#   cp .env.example .env   # then edit
#   docker compose up --build
# Put model.onnx + meta.json (from analysis/run_dl_case_study.py --export-onnx) in ./models to enable /api/classify.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      DATABASE_URL: postgresql://qc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/qc
      QC_MODEL_DIR: /models
      REVIEW_ADMIN_TOKEN: ${REVIEW_ADMIN_TOKEN:-}
      FRAME_SOURCE: ${FRAME_SOURCE:-}
    volumes:
      - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: qc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d qc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
